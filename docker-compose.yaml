services:
  mysql-db:
    image: mysql:latest
    container_name: mysql_test_db
    restart: unless-stopped
    ports:
      - "3301:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: my_test_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 123456789
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
